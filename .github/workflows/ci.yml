name: CI Matrix (Ubuntu & Windows)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-verify:
    name: Test (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install build and test tools
      run: |
        python -m pip install --upgrade pip
        pip install build wheel pytest

    - name: Build package (sdist & wheel)
      run: python -m build

    - name: Install from built wheel (POSIX)
      if: runner.os != 'Windows'
      run: |
        pip install dist/*.whl

    - name: Install from built wheel (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
        pip install $wheel

    - name: Smoke test CLI entrypoint
      run: |
        ki-manager-skills --help
        ki-manager-skills --version

    - name: Run all tests against installed package
      run: |
        pytest tests/ -v
