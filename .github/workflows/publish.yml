name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'  # Запуск только при создании тега (например, v2.0.1)

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi  # Среда для Trusted Publishing
      url: https://pypi.org/p/ki-manager
    permissions:
      id-token: write  # Обязательное разрешение для авторизации OIDC
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build hatchling pytest
          pip install -e .
          
      - name: Run tests
        run: pytest tests/ -v
          
      - name: Build package
        run: python -m build
        
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Set up Node.js for Smithery
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create MCP Bundle for Smithery
        run: zip -r server.mcpb manifest.json smithery.yaml .well-known README.md pyproject.toml src

      - name: Publish to Smithery Registry
        if: env.SMITHERY_API_KEY != ''
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: npx -y @smithery/cli@latest mcp publish ./server.mcpb -n bulyakovbr/ki-manager
